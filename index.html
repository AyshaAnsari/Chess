<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game - Multiplayer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>♔ Chess Game ♚</h1>
            <div class="controls">
                <button id="themeToggle" class="btn">🌓 Toggle Theme</button>
                <button id="newGame" class="btn">🎮 New Game</button>
                <button id="showDashboard" class="btn">📊 Dashboard</button>
            </div>
        </header>

        <div id="gameView" class="game-view">
            <div class="game-container">
                <div class="game-info">
                    <div class="player-info" id="player1Info">
                        <h3>⬜ White</h3>
                        <div class="captured" id="capturedByWhite"></div>
                    </div>
                    <div class="status-panel">
                        <div id="turnIndicator" class="turn-indicator">White's Turn</div>
                        <div id="gameStatus" class="game-status"></div>
                        <div id="moveHistory" class="move-history">
                            <h4>Move History</h4>
                            <div id="moveList"></div>
                        </div>
                    </div>
                    <div class="player-info" id="player2Info">
                        <h3>⬛ Black</h3>
                        <div class="captured" id="capturedByBlack"></div>
                    </div>
                </div>
                
                <div class="board-wrapper">
                    <div id="chessboard" class="chessboard"></div>
                </div>
            </div>
        </div>

        <div id="dashboardView" class="dashboard-view" style="display: none;">
            <div class="dashboard-container">
                <div class="dashboard-header">
                    <h2>📊 Game Statistics Dashboard</h2>
                    <button id="backToGame" class="btn">← Back to Game</button>
                </div>
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Total Games</h3>
                        <div class="stat-value" id="totalGames">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>White Wins</h3>
                        <div class="stat-value" id="whiteWins">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Black Wins</h3>
                        <div class="stat-value" id="blackWins">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Draws</h3>
                        <div class="stat-value" id="draws">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Checkmates</h3>
                        <div class="stat-value" id="checkmates">0</div>
                    </div>
                    <div class="stat-card">
                        <h3>Stalemates</h3>
                        <div class="stat-value" id="stalemates">0</div>
                    </div>
                </div>

                <div class="game-history">
                    <h3>Recent Games</h3>
                    <div id="gameHistoryList" class="game-history-list"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="promotionModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Choose Promotion Piece</h3>
            <div class="promotion-options" id="promotionOptions"></div>
        </div>
    </div>

    <script src="chess.js"></script>
    <script src="app.js"></script>
</body>
</html>
